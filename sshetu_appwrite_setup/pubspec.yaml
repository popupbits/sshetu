name: sshetu_appwrite_setup
description: >-
  Creates the Appwrite schema SSHetu's sync and secret vault expect. A separate
  package so the app itself never depends on the server SDK — and so a server
  API key is never within reach of anything that ships to a device.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.9.0

dependencies:
  dart_appwrite: ^25.1.0
  args: ^2.7.0
  dotenv: ^4.2.0

dev_dependencies:
  lints: ^6.0.0
