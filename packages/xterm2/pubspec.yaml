# Vendored copy of xterm2 5.3.0 — see VENDORED.md.
#
# Upstream dev-dependencies are deliberately dropped along with the tests they
# served: mockito and build_runner are code generators, and nothing in this
# repository runs them. Upstream's example/, media/, bin/, script/ and test/
# trees are not vendored either.
name: xterm2
description: Maintained Flutter terminal emulator package with fast rendering and broad VT/xterm compatibility.
version: 5.3.0
homepage: https://github.com/SoFluffyOS/xterm2
publish_to: 'none'

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  characters: ^1.4.0
  convert: ^3.0.0
  meta: ^1.3.0
  quiver: ^3.0.0
  equatable: ^2.0.3
  flutter:
    sdk: flutter
  zmodem: ^0.0.6

flutter:
