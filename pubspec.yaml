name: sshetu
description: SSH client and server manager for every device.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # Material, decoupled from the Flutter SDK. Every file under lib/ imports
  # this instead of package:flutter/material.dart — the two define
  # same-named, mutually incompatible types, and
  # test/no_frozen_material_test.dart enforces the rule.
  #
  # This is also why flutter_localizations is not listed. It has NOT been
  # decoupled — it is still an SDK-only package, and material_ui depends on
  # it for GlobalWidgetsLocalizations. What moved out of the SDK is the
  # Material and Cupertino localizations, which now live in material_ui and
  # cupertino_ui. So the app neither declares nor imports
  # flutter_localizations, and gets all three delegate sets from
  # GlobalMaterialLocalizations.delegates.
  material_ui: ^1.0.1

  # Adaptive Material widgets emit IconData with the CupertinoIcons font
  # family on iOS. Without this the tree-shaker warns and those glyphs
  # render as missing-character boxes.
  cupertino_icons: ^1.0.9
  flutter_riverpod: ^3.4.2

  # Use googleFontsTextTheme() from core/theme/, never
  # GoogleFonts.xTextTheme() — the latter returns a frozen-Material
  # TextTheme that material_ui ThemeData rejects.
  google_fonts: ^8.2.1
  intl: ^0.20.3

  # Backs the persisted user settings (accent, theme, language, text size),
  # loaded during bootstrap before the first frame.
  shared_preferences: ^2.5.5

  # Reads the installed version for the About screen, so what is shown can
  # never drift from what shipped.
  package_info_plus: ^10.2.1
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  go_router: ^17.5.0

  sqflite: ^2.4.3

  # Desktop ships no bundled SQLite; this supplies one over FFI. Registered
  # only on desktop platforms at runtime.
  sqflite_common_ffi: ^2.4.2+1
  path: ^1.9.1
  path_provider: ^2.1.6

  # Phosphor icons. 3.x models PiconData as an extension type over IconData,
  # so it survived IconData becoming a final class and call sites stay
  # const.
  picons: ^3.0.1

  # Play Core flexible update. Flexible rather than immediate: an immediate
  # update blocks behind a full-screen Play dialog until it finishes.
  # Android-only; every method no-ops elsewhere.
  in_app_update: ^5.0.0

  # Native review sheet. The store listing is still linked as a fallback:
  # the platform silently ignores requestReview when it has shown one
  # recently, so the explicit link is the only reliable path.
  in_app_review: ^2.0.12

  # SHA-256 for OpenSSH key fingerprints during import. Already in the tree
  # under dartssh2; named here because this app calls it directly, and a
  # transitive dependency can vanish under a version bump without warning.
  # Ed25519 key generation. dartssh2 already uses it for host keys, but an
  # app that imports a package declares it.
  pinenacl: ^0.6.0
  # StreamQueue, for reading a socket one frame at a time.
  async: ^2.13.0
  crypto: ^3.0.6

  # SSH, SFTP and port forwarding, pure Dart. 4.0.0 dropped SHA-1 key
  # exchange, ssh-rsa host keys and CBC ciphers from the defaults, so a
  # server offering nothing else now fails to negotiate rather than
  # connecting weakly. Hosts that genuinely need them re-enable them
  # per host through SSHAlgorithms — never globally.
  dartssh2: ^4.0.0

  # Vendored fork of xterm2 — see packages/xterm2/VENDORED.md for what
  # diverges from upstream and why.
  xterm2:
    path: packages/xterm2

  # The device-local half of SecretVault: OS keychain / keystore / DPAPI /
  # libsecret. Secrets never go in shared_preferences and never in sqflite.
  flutter_secure_storage: ^11.0.0

  # Gates the local vault behind fingerprint, face or device PIN. Never
  # enabled by default, and always with a PIN fallback — a user in gloves
  # must not be locked out of their own servers.
  local_auth: ^3.0.2

  # Importing a private key or an OpenSSH config from disk, and saving a
  # public key back out.
  file_selector: ^1.1.0

  # A terminal session dies if the screen sleeps mid-command. Held only
  # while a session is actually attached, released the moment it is not.
  wakelock_plus: ^1.8.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  cryptography: ^2.9.0
  marionette_flutter: ^0.6.0

  # Tells a session waiting to reconnect that the network is back, so it
  # tries now instead of at the end of its countdown. Read only while a
  # terminal tab is open; see features/sessions/reconnect_triggers.dart.
  connectivity_plus: ^7.3.1

  # ECDSA and RSA key generation. Already in the tree under dartssh2, which
  # signs with it; named here because the key generator calls it directly.
  pointycastle: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Drives the store-screenshot capture. See PROJECT.md.
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # Runs `gen-l10n` as part of `flutter build`/`run`, so the
  # generated AppLocalizations never lags behind the .arb files.
  generate: true

  assets:
    - lib/core/db/migrations/
    # The SIL OFL text of each bundled terminal face; the licence asks that
    # it travel with the font. Shown on the licences page.
    - assets/fonts/jetbrains_mono/OFL.txt
    - assets/fonts/fira_code/OFL.txt
    - assets/fonts/source_code_pro/OFL.txt
    - assets/fonts/ibm_plex_mono/OFL.txt

  # Terminal faces, bundled rather than fetched through google_fonts: that
  # downloads on first use, so an offline first launch would draw the grid
  # in a fallback face. See core/theme/terminal_fonts.dart. Regular and Bold
  # only — the grid draws bold, and italic is a slant xterm2 can synthesise.
  fonts:
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-Bold.ttf
          weight: 700
    - family: Fira Code
      fonts:
        - asset: assets/fonts/fira_code/FiraCode-Regular.ttf
        - asset: assets/fonts/fira_code/FiraCode-Bold.ttf
          weight: 700
    - family: Source Code Pro
      fonts:
        - asset: assets/fonts/source_code_pro/SourceCodePro-Regular.ttf
        - asset: assets/fonts/source_code_pro/SourceCodePro-Bold.ttf
          weight: 700
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/ibm_plex_mono/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/ibm_plex_mono/IBMPlexMono-Bold.ttf
          weight: 700
