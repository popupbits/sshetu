# Static analysis for SSHetu.
#
# One canonical config: `flutter_lints` plus the two leak rules the base set
# omits. Platform folders are excluded because generated Gradle/Xcode helper
# Dart files are not ours to fix.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - lib/l10n/app_localizations*.dart
    # Its own package, with its own pubspec and its own analysis_options.
    # Analyzing it from here resolves none of its dependencies — CI has no
    # reason to have fetched them — so every import reads as missing. It is
    # analyzed on its own in ci.yml instead.
    - sshetu_appwrite_setup/**

linter:
  rules:
    # Both catch leaks the base ruleset misses. A forgotten StreamSubscription
    # in a State is the single most common Flutter memory leak.
    cancel_subscriptions: true
    close_sinks: true
