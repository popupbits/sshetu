# Opens a pull request with the regenerated images.
#
# A PR rather than a push to the branch: store images are a visual change and
# the diff is the review. It also means the workflow does not need write access
# to a protected branch.

name: Open screenshot PR
description: Commit the rendered assets on a branch and open a pull request

inputs:
  paths:
    description: Paths to stage
    required: true
  title:
    description: Pull request title
    required: true
  branch:
    description: Branch name to push
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        PATHS: ${{ inputs.paths }}
        TITLE: ${{ inputs.title }}
        BRANCH: ${{ inputs.branch }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git add $PATHS
        if git diff --staged --quiet; then
          echo "images unchanged; nothing to open a PR for"
          exit 0
        fi

        git checkout -b "$BRANCH"
        git commit -m "$TITLE"
        git push --force-with-lease origin "$BRANCH"

        # A PR may already exist if this ran twice for the same branch.
        if [ -z "$(gh pr list --head "$BRANCH" --json number --jq '.[0].number')" ]; then
          gh pr create \
            --head "$BRANCH" \
            --title "$TITLE" \
            --body "Regenerated by the screenshot workflow.

        Every image was validated against the store's upload rules before this
        PR was opened — no alpha channel, Play's 2:1 aspect limit, and Apple's
        accepted dimensions. What that cannot check is whether they *look*
        right, so open a few before merging."
        else
          echo "PR for $BRANCH already open; pushed an update to it"
        fi
