# Build every file a person can download, and attach them to the release.
#
# ci.yml proves the app compiles on each desktop platform; this turns those
# builds into things someone can install — an APK, an installer, a disk
# image, a package — and uploads them to a GitHub release with their
# checksums. Nothing is sent to Google Play; android-release.yml is that, and
# it is not part of releasing.
#
# How a release happens, the same way it does in karmashala:
#
#   1. `dart run tool/release_meta.dart body` for the notes, if you want them
#      written for you.
#   2. Draft a release on `v<version>` in the GitHub UI and **publish** it.
#   3. That fires this workflow. Each job uploads its files as it finishes,
#      so the release fills up over the twenty minutes the builds take.
#
# `workflow_dispatch` does the same thing without the UI, creating the
# release if it does not exist yet. A pull request that touches any of this
# builds everything and uploads nothing.
#
# ---------------------------------------------------------------
# Secrets live in the `release` **environment**, not on the repository
#   Settings -> Environments -> release
#
#   ANDROID_KEYSTORE_BASE64    base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias inside the keystore
#   ANDROID_KEY_PASSWORD       key password
#
# An environment rather than repository secrets, because this repository is
# public: a repository secret is readable by any workflow in it, including
# one a pull request adds. An environment's secrets reach only the jobs that
# name it, never a fork's run, and the environment can be given required
# reviewers later without touching this file.
# ---------------------------------------------------------------

name: Release

on:
  # Published only, not tag pushes: creating a release from a tag would
  # otherwise fire this twice for the same version.
  release:
    types: [published]
  # A dry run whenever the release machinery itself changes: everything is
  # built and packaged, nothing is uploaded. Otherwise a broken installer
  # script is only discovered on the day it is needed, by the person least
  # able to wait for it.
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "tool/package_linux.dart"
      - "tool/release_meta.dart"
      - "tool/make_dmg.sh"
      - "tool/make_installer.ps1"
      - "windows/installer/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.0 (creates the release on v<version> if it does not exist)"
        required: false
        type: string
      skip_android:
        description: "Desktop only — skip the APKs"
        required: false
        type: boolean
        default: false
      flutter_version:
        description: "Flutter SDK version to build with"
        required: false
        type: string
        default: "3.47.5"

permissions:
  contents: write

# One release at a time, never cancelled: a half-cancelled run leaves a
# release holding some of its files, which is worse than one holding none.
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.version || github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: ${{ inputs.flutter_version || '3.47.5' }}

jobs:
  prepare:
    name: Gate and version
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build: ${{ steps.meta.outputs.build }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # The lock file as committed. A release built from a fresh resolution
      # is not the thing that was tested; `--enforce-lockfile` makes the two
      # the same build or no build.
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # The same three gates as ci.yml. A release can be published without a
      # green run behind it, and "we tagged it, so it must have been fine" is
      # how a broken release happens.
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --exclude-tags live

      - name: Version and tag
        id: meta
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="$(dart run tool/release_meta.dart version)"
          BUILD="$(dart run tool/release_meta.dart build)"
          case "${{ github.event_name }}" in
            release) TAG="$EVENT_TAG" ;;
            workflow_dispatch) TAG="v${INPUT_VERSION:-$VERSION}" ;;
            *) TAG="v$VERSION" ;;
          esac
          # Fails the whole release when the tag and pubspec disagree, which
          # is the one mistake that is invisible afterwards: every file would
          # be named after a version the app does not report.
          dart run tool/release_meta.dart check-tag "$TAG"
          {
            echo "version=$VERSION"
            echo "build=$BUILD"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

      # Only when this was started by hand. A release that a person published
      # already has the words they chose on it, and overwriting those would
      # be rude.
      - name: Create the release, if dispatching made one necessary
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG already exists; its notes are left alone."
            exit 0
          fi
          dart run tool/release_meta.dart body "$VERSION" > body.md
          PRERELEASE=()
          case "$TAG" in *-*) PRERELEASE=(--prerelease) ;; esac
          gh release create "$TAG" "${PRERELEASE[@]}" \
            --target "$GITHUB_SHA" \
            --title "SSHetu $VERSION" \
            --notes-file body.md

  android:
    name: Android APKs
    needs: prepare
    if: ${{ !inputs.skip_android && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    # The one job that may read the signing key.
    environment: release
    timeout-minutes: 40

    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      # Checked before anything is built, so a missing secret costs ten
      # seconds rather than ten minutes. Deliberately a failure and not a
      # warning: Gradle falls back to the debug key when key.properties is
      # missing, and a debug-signed APK is indistinguishable from a real one
      # until someone tries to update it.
      - name: Require the signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set on the release environment. Add the four ANDROID_* secrets (see the header of this workflow), or re-run with skip_android: true to ship the desktop files alone."
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Decode the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p android/keystore
          KS="$PWD/android/keystore/upload-keystore.jks"
          # `tr -d '\r\n'` defends against a CRLF or line-wrapped secret. GNU
          # base64 folds stray bytes into its output silently, and the
          # resulting "keystore" then trips the JDK's ASN.1 parser deep
          # inside Gradle.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > "$KS"
          if [ "$(stat -c%s "$KS")" -lt 1000 ]; then
            echo "::error::Decoded keystore is implausibly small — check ANDROID_KEYSTORE_BASE64."
            exit 1
          fi
          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n" \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" \
            "$ANDROID_KEY_ALIAS" "$KS" > android/key.properties

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # Both shapes, because a download page serves two people: one who knows
      # their phone is arm64 and wants 25 MB, and one who does not and wants
      # the file that always works.
      - name: Build per-ABI APKs
        run: flutter build apk --release --split-per-abi

      - name: Build the universal APK
        run: flutter build apk --release

      - name: Collect
        run: |
          set -euo pipefail
          mkdir -p dist
          APK=build/app/outputs/flutter-apk
          for abi in armeabi-v7a arm64-v8a x86_64; do
            cp "$APK/app-$abi-release.apk" "dist/sshetu-$VERSION-android-$abi.apk"
          done
          cp "$APK/app-release.apk" "dist/sshetu-$VERSION-android-universal.apk"
          ls -la dist

      - name: Check the signer is not the debug key
        run: |
          set -euo pipefail
          APKSIGNER="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "dist/sshetu-$VERSION-android-universal.apk" | tee signer.txt
          if grep -q "CN=Android Debug" signer.txt; then
            echo "::error::The APK is signed with the Android debug key — the release keystore was not used."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: dist
          if-no-files-found: error

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: dist/*
          fail_on_unmatched_files: true

  windows:
    name: Windows installer
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 40

    env:
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # The same script people run locally — tool/make_installer.ps1 — so the
      # installer CI produces and the one a maintainer builds by hand are the
      # same artifact, firewall rule and all.
      - name: Build the installer
        shell: pwsh
        run: ./tool/make_installer.ps1

      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "windows/installer/output/SSHetu-Setup-$env:VERSION.exe" `
            "dist/sshetu-$env:VERSION-windows-x64-setup.exe"
          # A zip beside the installer, for a locked-down machine where
          # nothing may be installed. It has no firewall rule, so "send to a
          # device" will prompt or silently fail there.
          Compress-Archive -Path "build/windows/x64/runner/Release/*" `
            -DestinationPath "dist/sshetu-$env:VERSION-windows-x64-portable.zip"
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist
          if-no-files-found: error

      - name: Attach to the release
        if: ${{ github.event_name != 'pull_request' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: dist/*
          fail_on_unmatched_files: true

  macos:
    name: macOS disk image
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 40

    env:
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build
        run: flutter build macos --release

      - name: Build the disk image
        run: ./tool/make_dmg.sh

      # Printed rather than asserted: what this .dmg contains and how it is
      # signed is something the release notes should not have to guess at.
      - name: Describe the build
        run: |
          APP=build/macos/Build/Products/Release/SSHetu.app
          lipo -archs "$APP/Contents/MacOS/SSHetu" || true
          codesign -dv "$APP" 2>&1 || true

      - name: Collect
        run: |
          set -euo pipefail
          mkdir -p dist
          DMG="$(ls build/macos/SSHetu-*.dmg | head -1)"
          cp "$DMG" "dist/sshetu-$VERSION-macos.dmg"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist
          if-no-files-found: error

      - name: Attach to the release
        if: ${{ github.event_name != 'pull_request' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: dist/*
          fail_on_unmatched_files: true

  linux:
    name: Linux tarball and .deb
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD: ${{ needs.prepare.outputs.build }}

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # The -dev half of what the app links against; the list and the reason
      # for each entry are in ci.yml.
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev \
            libjsoncpp-dev libsqlite3-dev

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build
        run: flutter build linux --release

      - name: Package
        run: dart run tool/package_linux.dart --version "$VERSION" --build "$BUILD"

      # Proof the package is installable rather than merely well-formed: this
      # resolves its declared dependencies against a real apt.
      - name: Install the .deb
        run: |
          set -euo pipefail
          sudo apt-get install -y ./dist/sshetu_${VERSION}-${BUILD}_amd64.deb
          dpkg -s sshetu | sed -n '1,12p'
          test -x /usr/bin/sshetu
          test -f /usr/share/applications/com.popupbits.sshetu.desktop
          sudo apt-get remove -y sshetu

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist
          if-no-files-found: error

      - name: Attach to the release
        if: ${{ github.event_name != 'pull_request' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: dist/*
          fail_on_unmatched_files: true

  checksums:
    name: Checksums
    needs: [prepare, android, windows, macos, linux]
    # `always()`, because skip_android and a pull request both leave the
    # Android job skipped rather than successful — but every job that did run
    # still has to have passed.
    if: >-
      always()
      && github.event_name != 'pull_request'
      && needs.prepare.result == 'success'
      && needs.windows.result == 'success'
      && needs.macos.result == 'success'
      && needs.linux.result == 'success'
      && (needs.android.result == 'success' || needs.android.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      # Last, and from the files as uploaded, so the list covers everything
      # the release actually holds.
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: SHA256SUMS.txt
          fail_on_unmatched_files: true

      - name: Say what landed
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job, so gh has no repository to infer.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          {
            echo "### $TAG"
            echo
            gh release view "$TAG" --json assets \
              --jq '.assets[] | "- \(.name) (\(.size) bytes)"'
          } >> "$GITHUB_STEP_SUMMARY"
