# Analyze and test on every push and pull request.
#
# This project ships tests that guard real invariants — no frozen Material
# imports, the app starts and routes, the layout adapts, the migrations
# apply — and a guard nobody runs is not a guard. This workflow is what makes
# them binding.
#
# It also compiles every desktop target. Linux and Windows cannot be built on
# a Mac, which is where this app is developed, so without CI they were the two
# platforms nobody had ever compiled — "cross-platform" on trust. A hosted
# runner each is the whole fix.
#
# Releasing is deliberately separate and manual: android-release.yml.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        # Zero errors and zero warnings is the bar PROJECT.md sets.
        run: flutter analyze

      - name: Test
        # `live` tests start a real sshd on loopback. They run locally where
        # one exists and are excluded here, because a hosted runner refusing to
        # start sshd should not read as this app being broken.
        run: flutter test --exclude-tags live

  desktop:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      # One platform failing to compile is worth knowing about on its own, so
      # the others still run.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      # Every one of these is a plugin's link-time dependency, and each was
      # read out of that plugin's own linux/CMakeLists.txt rather than
      # guessed:
      #
      #   gtk-3, ninja        the runner itself
      #   libsecret-1         flutter_secure_storage_linux — where this app's
      #                       credentials live on Linux
      #   libsqlite3          sqflite_common_ffi
      #   libjsoncpp          flutter_secure_storage_linux
      #
      # A missing one fails at link time with an error that names a symbol
      # rather than a package, which is a bad afternoon.
      - name: Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev \
            libjsoncpp-dev libsqlite3-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Enable ${{ matrix.target }}
        run: flutter config --enable-${{ matrix.target }}-desktop

      - name: Build
        # Release, not debug: a debug desktop build can succeed while the
        # release one fails on tree-shaking or a missing plugin registration.
        run: flutter build ${{ matrix.target }} --release

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sshetu-${{ matrix.target }}
          # Each toolchain puts its bundle somewhere different; whichever path
          # exists is the one that gets uploaded.
          path: |
            build/linux/*/release/bundle
            build/windows/*/runner/Release
            build/macos/Build/Products/Release/*.app
          if-no-files-found: error
          retention-days: 14
