# Capture, frame and open a PR with the App Store screenshots.
#
# macOS, because the iOS simulator has no Linux equivalent — this is the only
# workflow here that genuinely needs a Mac runner, and macOS minutes bill at
# 10x on a private repo.
#
# One job per device family: Apple requires a 6.9" iPhone set, and a 13" iPad
# set as well if the app runs on iPad. Each is captured on a matching
# simulator and framed by moksha at the exact size App Store Connect accepts.

name: Screenshots (iOS)

on:
  workflow_dispatch:
    inputs:
      locale:
        # App Store languages, which are not the Play ones — Apple accepts a
        # fixed list with no Nepali.
        description: "App Store locale"
        type: choice
        default: en-US
        options:
          - en-US
      families:
        description: "Which device families to regenerate"
        type: choice
        default: iphone
        options:
          - iphone
          - iphone+ipad

permissions:
  contents: write
  pull-requests: write

jobs:
  screenshots:
    runs-on: macos-latest
    timeout-minutes: 90

    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - family: iphone
            simulator: "iPhone 17 Pro Max"
            asset_type: iphone-screenshot
            size_id: "ios-6.9"
          - family: ipad
            simulator: "iPad Pro 13-inch (M4)"
            asset_type: ipad-screenshot
            size_id: "ipad-13"

    steps:
      - uses: actions/checkout@v7

      - name: Skip families that were not asked for
        id: want
        run: |
          if [ "${{ matrix.family }}" = "ipad" ] && \
             [ "${{ inputs.families }}" != "iphone+ipad" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: subosito/flutter-action@v2
        if: steps.want.outputs.run == 'true'
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Install dependencies
        if: steps.want.outputs.run == 'true'
        run: flutter pub get

      - name: Boot the simulator
        if: steps.want.outputs.run == 'true'
        id: sim
        run: |
          set -euo pipefail
          # What the runner's Xcode actually has, in case the name has moved on.
          xcrun simctl list devicetypes | grep -i -E 'iphone|ipad' || true
          udid=$(xcrun simctl create shots "${{ matrix.simulator }}")
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Capture
        if: steps.want.outputs.run == 'true'
        env:
          LOCALE: ${{ inputs.locale }}
        run: |
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/screenshot_test.dart \
            --dart-define=SCREENSHOT_LOCALE="${LOCALE%%-*}" \
            -d ${{ steps.sim.outputs.udid }}

      - name: Build the moksha job
        if: steps.want.outputs.run == 'true'
        run: |
          dart run tool/screenshot_job.dart \
            --asset-type ${{ matrix.asset_type }} \
            --size-id ${{ matrix.size_id }} \
            --locale ${{ inputs.locale }} \
            --out "$RUNNER_TEMP/job.json"

      - name: Render
        if: steps.want.outputs.run == 'true'
        uses: ./.github/actions/moksha-render
        with:
          job: ${{ runner.temp }}/job.json
          destination: ios/fastlane/screenshots/${{ inputs.locale }}/${{ matrix.family }}

      - name: Open a PR
        if: steps.want.outputs.run == 'true'
        uses: ./.github/actions/open-screenshot-pr
        with:
          paths: ios/fastlane/screenshots
          title: "chore: refresh App Store ${{ matrix.family }} screenshots (${{ inputs.locale }})"
          branch: screenshots/appstore-${{ matrix.family }}-${{ inputs.locale }}

      - name: Shut the simulator down
        if: always() && steps.want.outputs.run == 'true'
        run: xcrun simctl delete ${{ steps.sim.outputs.udid }} || true

      - uses: actions/upload-artifact@v4
        if: always() && steps.want.outputs.run == 'true'
        with:
          name: appstore-${{ matrix.family }}-${{ inputs.locale }}
          path: ios/fastlane/screenshots/${{ inputs.locale }}/
          if-no-files-found: warn
