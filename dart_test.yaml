# The `live` tag marks tests that start a real OpenSSH server on loopback and
# connect to it. They need no network and no privileges, so they run by default
# where `sshd` exists and skip themselves where it does not.
#
# CI excludes them explicitly (`--exclude-tags live`), because a hosted runner
# refusing to start sshd should not read as this app being broken.
tags:
  live:

  # Timing assertions, with budgets several times the measured cost so they
  # catch a regression rather than a slow runner. They are cheap, so they run
  # by default; exclude with --exclude-tags perf if a machine is pathological.
  perf:
